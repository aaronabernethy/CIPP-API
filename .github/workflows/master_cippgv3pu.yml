name: Deploy CIPP-API to Azure Function App - cippgv3pu

# Deploys this fork's master branch to the self-hosted CIPP Function App.
# Replaces the one-time ZipDeploy from the original ARM template so that
# syncing this fork with upstream automatically updates the API.
#
# The publish profile lives in the repo secret AZURE_FUNCTIONAPP_PUBLISH_PROFILE.

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  AZURE_FUNCTIONAPP_PACKAGE_PATH: "."

jobs:
  deploy:
    if: github.repository_owner == 'aaronabernethy'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and stage modules
        shell: pwsh
        run: ./Tools/Build-DevApiModules.ps1

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: "cippgv3pu"
          slot-name: "production"
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
